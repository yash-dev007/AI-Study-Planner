# Adaptive Syllabus & Lecture Planning — local stack with PostgreSQL.
#
#   cp .env.example .env      # then set JWT_SECRET (and POSTGRES_PASSWORD)
#   docker compose up --build
#   open http://localhost:8000/app/
#
# The database is migrated by the api service before it starts serving.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syllabus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syllabus}
      POSTGRES_DB: ${POSTGRES_DB:-syllabus}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syllabus} -d ${POSTGRES_DB:-syllabus}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-syllabus}:${POSTGRES_PASSWORD:-syllabus}@db:5432/${POSTGRES_DB:-syllabus}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env to a long random value}
      STORAGE_DIR: /data/storage
      FRONTEND_DIR: /srv/frontend
      SEED_DEMO_DATA: "false"
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.0-flash-001}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      # The UI is static files: mount them instead of rebuilding the image.
      - ./frontend:/srv/frontend:ro
      - api_storage:/data/storage
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    restart: unless-stopped

volumes:
  db_data:
  api_storage:
