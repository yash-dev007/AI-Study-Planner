[project]
name = "adaptive-syllabus-api"
version = "0.1.0"
description = "Adaptive Syllabus & Lecture Planning System API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0.36,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-multipart>=0.0.12,<1.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "pyjwt>=2.9,<3.0",
    "email-validator>=2.2,<3.0",
    "pymupdf>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
]
ocr = [
    "pytesseract>=0.3.13,<1.0",
    "Pillow>=10.4,<12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# Alembic generates these; they are rewritten by `alembic revision --autogenerate`.
"alembic/versions/*.py" = ["E501"]
# Syllabi are written with typographic dashes: the separators must accept them.
"app/ai/rule_based.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
